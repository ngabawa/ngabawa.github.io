<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#140c0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>ငါ့ဘဝ - မြန်မာ (Royal Heritage Edition)</title>
<style>
:root{
  --bg:#0d0706;
  --bg2:#190e0b;
  --card:rgba(31,17,13,.88);
  --card2:rgba(46,25,18,.92);
  --line:rgba(242,193,78,.24);
  --line-gold:rgba(247,208,106,.55);
  --txt:#fbf3e4;
  --mut:#cbb593;
  --gold:#f5c75d;
  --gold2:#ffe599;
  --crimson:#b8293d;
  --jade:#25b879;
  --sapphire:#38bdf8;
  --amethyst:#c084fc;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Noto Sans Myanmar","Myanmar Text",sans-serif;overflow:hidden}
body{
  background:
    radial-gradient(circle at 15% 10%, rgba(184,41,61,.24), transparent 42%),
    radial-gradient(circle at 85% 15%, rgba(245,199,93,.18), transparent 45%),
    radial-gradient(circle at 50% 100%, rgba(37,184,121,.10), transparent 50%),
    linear-gradient(170deg, #140a08 0%, #0b0605 65%, #120907 100%);
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.35;
  background-image:radial-gradient(rgba(245,199,93,.22) 1px, transparent 1px);
  background-size:24px 24px;
}
#app{position:relative;z-index:1;display:flex;flex-direction:column;height:100%;max-width:720px;margin:0 auto;border-left:1px solid rgba(245,199,93,.08);border-right:1px solid rgba(245,199,93,.08)}

#ib{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:8px 14px;background:linear-gradient(90deg,rgba(184,41,61,.35),rgba(245,199,93,.2));
  border-bottom:1px solid var(--line);font-size:12px
}
#ib[hidden]{display:none}
#ib button{padding:5px 10px;border-radius:999px;border:1px solid var(--line-gold);background:rgba(245,199,93,.18);color:var(--gold2);font-weight:700;cursor:pointer;font-size:11px}

#hd{
  display:flex;align-items:center;gap:12px;
  padding:12px 14px;
  background:linear-gradient(180deg,rgba(42,22,16,.96),rgba(22,12,9,.94));
  border-bottom:1px solid var(--line);
  box-shadow:0 8px 24px rgba(0,0,0,.45)
}
.av{
  width:58px;height:58px;border-radius:50%;flex:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 30% 30%, rgba(255,229,153,.25), rgba(184,41,61,.25));
  border:2px solid var(--line-gold);
  box-shadow:0 0 18px rgba(245,199,93,.25);
  transition:transform .25s ease, box-shadow .25s ease
}
.av:hover{transform:scale(1.05);box-shadow:0 0 24px rgba(245,199,93,.45)}
.nm{flex:1;min-width:0;line-height:1.35}
.nm b{display:block;font-size:16px;color:var(--gold2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.2px}
.nm small{display:block;font-size:11.5px;color:var(--mut)}
.m{
  padding:7px 11px;border-radius:14px;cursor:pointer;flex:none;
  background:linear-gradient(135deg,rgba(245,199,93,.18),rgba(184,41,61,.2));
  border:1px solid var(--line-gold);color:var(--gold2);font-weight:700;font-size:12px;
  box-shadow:0 4px 12px rgba(0,0,0,.3);transition:transform .15s ease
}
.m:active{transform:scale(.96)}

#st{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:7px 12px;
  padding:9px 14px;background:rgba(18,10,8,.82);border-bottom:1px solid var(--line)
}
.b{display:flex;align-items:center;gap:7px;font-size:11.5px}
.b span{width:64px;flex:none;color:var(--mut);font-weight:600}
.b i{flex:1;height:8px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;display:block;border:1px solid rgba(255,255,255,.06)}
.b i u{display:block;height:100%;border-radius:999px;transition:width .45s cubic-bezier(.22,1,.36,1)}
.b em{font-style:normal;width:36px;text-align:right;font-weight:700;color:var(--txt);font-size:11px}
.b.lo em{color:#ff6b81}
.b.lo i{box-shadow:0 0 8px rgba(255,107,129,.45)}

#tb{
  position:relative;display:grid;grid-template-columns:repeat(5,1fr);
  background:rgba(23,12,9,.94);border-bottom:1px solid var(--line)
}
#tb b{
  position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  padding:9px 4px;font-weight:600;font-size:11px;color:var(--mut);cursor:pointer;
  transition:color .2s ease, background .2s ease
}
#tb b span{font-size:15px;line-height:1}
#tb b.on{color:var(--gold2);background:linear-gradient(180deg,rgba(245,199,93,.14),transparent)}
#tb b.on::after{
  content:"";position:absolute;bottom:0;left:16%;right:16%;height:2.5px;border-radius:999px;
  background:linear-gradient(90deg,var(--gold),var(--gold2),var(--gold));
  box-shadow:0 0 10px rgba(245,199,93,.7)
}

#ct{flex:1;overflow-y:auto;padding:14px;scroll-behavior:smooth}
#ct.in .n{animation:riseIn .32s cubic-bezier(.22,1,.36,1) both}
@keyframes riseIn{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}

.hero{
  text-align:center;padding:24px 18px;
  background:
    linear-gradient(160deg,rgba(56,28,18,.92),rgba(25,13,10,.95));
  border:1px solid var(--line-gold);border-radius:20px;
  box-shadow:0 14px 36px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,229,153,.25)
}
.hero h2{margin:10px 0 6px;font-size:24px;color:var(--gold2);text-shadow:0 2px 14px rgba(245,199,93,.28)}
.hero small{display:block;color:var(--mut);line-height:1.6;font-size:13px}

.c{
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:12px 14px;margin-bottom:10px;line-height:1.58;font-size:13.5px;
  box-shadow:0 6px 18px rgba(0,0,0,.28);backdrop-filter:blur(8px)
}
.c b{color:var(--gold2)}
.c small{color:var(--mut);line-height:1.5}
.c.r{border-left:3.5px solid var(--crimson);background:linear-gradient(90deg,rgba(184,41,61,.14),var(--card))}
.c.y{border-left:3.5px solid var(--gold);background:linear-gradient(90deg,rgba(245,199,93,.15),var(--card))}

button{
  display:block;width:100%;text-align:left;padding:12px 14px;margin-bottom:8px;
  border-radius:14px;border:1px solid var(--line);
  background:linear-gradient(180deg,rgba(45,25,18,.9),rgba(28,15,11,.95));
  color:var(--txt);font-size:13.5px;font-weight:600;cursor:pointer;
  transition:transform .14s ease, border-color .2s ease, box-shadow .2s ease, background .2s ease;
  box-shadow:0 4px 12px rgba(0,0,0,.28)
}
button:hover:not(:disabled){
  border-color:var(--line-gold);
  background:linear-gradient(180deg,rgba(64,35,24,.95),rgba(36,19,14,.98));
  transform:translateY(-1px)
}
button:active:not(:disabled){transform:scale(.985)}
button:disabled{opacity:.42;cursor:not-allowed}
button.pri{
  background:linear-gradient(135deg,#c98a1e 0%,#f5c75d 52%,#d49422 100%);
  color:#190c06;border:1px solid #ffe8a3;font-weight:800;
  box-shadow:0 6px 20px rgba(245,199,93,.32)
}
button.pri:hover:not(:disabled){filter:brightness(1.06);box-shadow:0 8px 24px rgba(245,199,93,.45)}

#dk{
  display:none;align-items:center;justify-content:space-between;gap:12px;
  padding:10px 14px;background:linear-gradient(180deg,rgba(26,14,10,.96),rgba(14,7,6,.98));
  border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(0,0,0,.5)
}
#dk .bs b{font-size:13.5px;color:var(--gold2)}
#dk .bs small{font-size:11.5px;color:var(--mut)}
#dk .ag{
  width:72px;height:54px;flex:none;text-align:center;padding:6px;margin:0;
  border-radius:16px;background:linear-gradient(135deg,var(--crimson),#7d1524);
  border:1.5px solid var(--line-gold);color:var(--gold2);font-size:18px;font-weight:800;
  box-shadow:0 6px 18px rgba(184,41,61,.45)
}

/* အသုဘဖိတ်စာ Card */
.funeral-card{
  position:relative;padding:20px 18px;margin-bottom:14px;border-radius:20px;
  background:
    linear-gradient(170deg,rgba(36,20,16,.97),rgba(16,9,8,.99));
  border:2px solid var(--gold);
  box-shadow:0 16px 40px rgba(0,0,0,.7), inset 0 0 0 4px rgba(184,41,61,.35), inset 0 0 24px rgba(245,199,93,.12);
  text-align:center
}
.funeral-badge{
  display:inline-block;padding:4px 12px;border-radius:999px;font-size:11px;font-weight:800;
  letter-spacing:1px;color:var(--gold2);background:rgba(184,41,61,.35);border:1px solid var(--line-gold);
  margin-bottom:8px
}
.funeral-title{font-size:20px;font-weight:800;color:var(--gold2);margin:4px 0}
.funeral-sub{font-size:12.5px;color:var(--mut);margin-bottom:12px}
.funeral-bio{
  text-align:left;padding:12px 14px;border-radius:14px;
  background:rgba(255,255,255,.04);border:1px solid rgba(245,199,93,.2);
  font-size:13px;line-height:1.65;color:var(--txt);margin-bottom:12px
}
.funeral-quote{font-style:italic;font-size:12.5px;color:var(--gold);line-height:1.55}

#md{
  position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(0,0,0,.72);backdrop-filter:blur(5px);animation:fadeIn .2s ease
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sh{
  width:100%;max-width:680px;max-height:86vh;overflow-y:auto;
  padding:16px;border-radius:22px 22px 0 0;
  background:linear-gradient(180deg,#25140f,#140a08);
  border-top:1.5px solid var(--line-gold);box-shadow:0 -12px 36px rgba(0,0,0,.7)
}
.sh input{
  width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);
  background:rgba(0,0,0,.35);color:var(--txt);font-size:13.5px;margin-top:6px
}
.c input{
  width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);
  background:rgba(0,0,0,.35);color:var(--txt);font-size:13.5px;margin-top:6px
}

.ts{
  position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:80;
  padding:10px 18px;border-radius:999px;background:linear-gradient(135deg,#2b1711,#160b08);
  border:1px solid var(--line-gold);color:var(--gold2);font-size:13px;font-weight:700;
  box-shadow:0 10px 26px rgba(0,0,0,.6)
}
.rp{
  position:fixed;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;
  pointer-events:none;z-index:60;border:2px solid var(--gold2);
  animation:ripAnim .62s cubic-bezier(.16,1,.3,1) forwards
}
@keyframes ripAnim{from{opacity:.85;transform:scale(.2)}to{opacity:0;transform:scale(2.6)}}

.shake{animation:shk .4s ease}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.flash-gold{animation:fg .7s ease}
@keyframes fg{0%{box-shadow:0 0 0 rgba(245,199,93,0)}50%{box-shadow:0 0 24px rgba(245,199,93,.65)}100%{box-shadow:0 0 0 rgba(245,199,93,0)}}
</style>
</head>
<body>
<div id="app">
  <div id="ib" hidden>
    <span>📲 ဖုန်းထဲ ထည့်သွင်းပြီး အလွယ်တကူ ဆော့ကစားပါ</span>
    <div>
      <button onclick="inst()">ထည့်သွင်းမယ်</button>
      <button onclick="this.parentElement.parentElement.hidden=true">✕</button>
    </div>
  </div>
  <div id="hd"></div>
  <div id="st" data-k=""></div>
  <div id="tb"></div>
  <div id="ct" class="in"></div>
  <div id="dk"></div>
</div>
<script src="game.js"></script>
</body>
</html>
